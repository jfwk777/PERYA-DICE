<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PERYA DICE</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     LOGO
========================= -->

<img
    class="logo"
    src="images/PERYA.png"
    alt="PERYA DICE"
>




<!-- =========================
     DICE SECTION
========================= -->

<section class="diceSection">

    <h4>

        Number of Dice


        <select id="diceCount">


            <option value="1">
                1
            </option>


            <option value="2">
                2
            </option>


            <option value="3" selected>
                3
            </option>


            <option value="4">
                4
            </option>


            <option value="5">
                5
            </option>


            <option value="6">
                6
            </option>


        </select>


    </h4>




    <div id="results"></div>




    <button id="rollButton">

        🎲 Roll Dice

    </button>



</section>




<script src="script.js"></script>


</body>

</html>
